<app-form-wrapper [form]="loginForm" (submitted)="login()">

  <app-alert
    *ngIf="errorMsg"
    type="error"
    [message]="errorMsg">
  </app-alert>

  <app-input
    label="Email"
    type="email"
    [formControl]="email"
    [errorMessage]="
      email.touched && email.invalid
        ? 'Valid email is required'
        : ''
    ">
  </app-input>

  <app-input
    label="Password"
    type="password"
    [formControl]="password"
    [errorMessage]="
      password.touched && password.invalid
        ? 'Password is required'
        : ''
    ">
  </app-input>

  <app-button label="Login" type="submit"></app-button>

</app-form-wrapper>

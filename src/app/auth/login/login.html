<app-form-wrapper [form]="loginForm" (submitted)="login()">

  <div
    *ngIf="successMsg"
    class="alert alert-success d-flex align-items-center mb-3"
    role="alert">
    <i class="bi bi-check-circle-fill me-2"></i>
    <span>{{ successMsg }}</span>
  </div>

  <div
    *ngIf="errorMsg"
    class="alert alert-danger d-flex align-items-center mb-3"
    role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <span>{{ errorMsg }}</span>
  </div>

  <app-input
    label="Email"
    type="email"
    [value]="loginForm.get('email')?.value"
    (valueChange)="loginForm.get('email')?.setValue($event)"
    [errorMessage]="
      loginForm.get('email')?.touched && loginForm.get('email')?.invalid
        ? 'Valid email is required'
        : ''
    ">
  </app-input>

  <app-input
    label="Password"
    type="password"
    [value]="loginForm.get('password')?.value"
    (valueChange)="loginForm.get('password')?.setValue($event)"
    [errorMessage]="
      loginForm.get('password')?.touched && loginForm.get('password')?.invalid
        ? 'Password is required'
        : ''
    ">
  </app-input>

  <app-button label="Login" type="submit"></app-button>

  <p class="text-center mt-3">
    Don’t have an account?
    <a routerLink="/register">Create account</a>
  </p>

</app-form-wrapper>

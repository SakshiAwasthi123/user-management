<app-form-wrapper [form]="loginForm" (submitted)="login()">

  <app-input
    label="Email"
    type="email"
    [value]="loginForm.get('email')?.value"
    (valueChange)="loginForm.get('email')?.setValue($event)"
    [errorMessage]="
      loginForm.get('email')?.touched && loginForm.get('email')?.invalid
        ? 'Valid email is required'
        : ''
    ">
  </app-input>

  <app-input
    label="Password"
    type="password"
    [value]="loginForm.get('password')?.value"
    (valueChange)="loginForm.get('password')?.setValue($event)"
    [errorMessage]="
      loginForm.get('password')?.touched && loginForm.get('password')?.invalid
        ? 'Password is required'
        : ''
    ">
  </app-input>

  <app-button label="Login" type="submit"></app-button>

  <p class="text-danger text-center mt-2" *ngIf="errorMsg">
    {{ errorMsg }}
  </p>

  <p class="text-center mt-3">
    Don’t have an account?
    <a routerLink="/register">Create account</a>
  </p>

</app-form-wrapper>

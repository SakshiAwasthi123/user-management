<div class="container vh-100 d-flex align-items-center justify-content-center bg-light">

  <div class="card shadow-lg border-0" style="width: 420px;">
    <div class="card-body p-4">

      <!-- Header -->
      <div class="text-center mb-4">
        <img src="assets/logo.png" height="60" class="mb-2">
        <h4 class="fw-bold mb-1">Sign in to your account</h4>
        <p class="text-muted small">User Management System</p>
      </div>

      <!-- 🔴 GLOBAL ERROR (TOP POSITION) -->
      <div
        *ngIf="errorMsg"
        class="alert alert-danger text-center py-2 mb-3">
        {{ errorMsg }}
      </div>

      <form #loginForm="ngForm" (ngSubmit)="login(loginForm)">

        <!-- Email -->
        <app-input
          label="Email"
          type="email"
          placeholder="Enter email"
          [(value)]="email"
          [errorMessage]="
            loginForm.submitted && !email
              ? 'Email is required'
              : ''
          ">
        </app-input>

        <!-- Password -->
        <app-input
          label="Password"
          type="password"
          placeholder="Enter password"
          [(value)]="password"
          [errorMessage]="
            loginForm.submitted && !password
              ? 'Password is required'
              : ''
          ">
        </app-input>

        <!-- Remember Me -->
        <div class="form-check form-check-sm mb-3 d-flex align-items-center">
          <input
            class="form-check-input me-2"
            type="checkbox"
            id="rememberMe"
            name="rememberMe"
            [(ngModel)]="rememberMe">
          <label class="form-check-label small mb-0" for="rememberMe">
            Remember me
          </label>
        </div>


        <!-- Submit Button -->
        <app-button
            label="Login"
            type="submit"
            class="w-100"
            [disabled]="loginForm.invalid === true">
        </app-button>


      </form>

      <!-- Footer -->
      <div class="text-center mt-3">
        <span class="text-muted">Don’t have an account?</span>
        <a routerLink="/register" class="fw-semibold ms-1">
          Create account
        </a>
      </div>

    </div>
  </div>

</div>

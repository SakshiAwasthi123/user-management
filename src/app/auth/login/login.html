<div class="container vh-100 d-flex align-items-center justify-content-center">

  <div class="card shadow-lg border-0" style="width: 420px">
    <div class="card-body p-4">

      <div class="text-center mb-4">
        <img src="assets/logo.png" height="60">
        <h4 class="mt-3 fw-bold">Sign in to your account</h4>
        <p class="text-muted small">User Management System</p>
      </div>

      <form #loginForm="ngForm" (ngSubmit)="login(loginForm)">

        <app-input
          label="Email"
          type="email"
          placeholder="Enter email"
          [(value)]="email"
          [errorMessage]="!email && loginForm.submitted ? 'Email is required' : ''">
        </app-input>

        <app-input
          label="Password"
          type="password"
          placeholder="Enter password"
          [(value)]="password"
          [errorMessage]="!password && loginForm.submitted ? 'Password is required' : ''">
        </app-input>

        <div class="form-check mb-3">
          <input
            class="form-check-input"
            type="checkbox"
            name="rememberMe"
            [(ngModel)]="rememberMe">
          <label class="form-check-label">Remember me</label>
        </div>

        <div class="alert alert-danger text-center" *ngIf="errorMsg">
          {{ errorMsg }}
        </div>
        <app-button
          label="Login"
          type="submit"
          [disabled]="!!loginForm.invalid">
        </app-button>


      </form>

      <div class="text-center mt-3">
        <a routerLink="/register">Create account</a>
      </div>

    </div>
  </div>

</div>

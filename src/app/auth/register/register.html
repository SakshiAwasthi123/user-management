<div class="container py-5">

  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

      <div class="card shadow-lg border-0 register-card">
        <div class="card-body p-4 p-md-5">

          <!-- Header -->
          <div class="text-center mb-4">
            <img src="assets/logo.png" height="56" class="mb-2">
            <h4 class="fw-bold mb-1">Create your account</h4>
            <p class="text-muted small mb-0">
              User Management System
            </p>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input
              type="email"
              class="form-control"
              placeholder="Enter email"
              [(ngModel)]="email">
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              placeholder="Enter password"
              [(ngModel)]="password">
          </div>

          <!-- Confirm Password -->
          <div class="mb-3">
            <label class="form-label">Confirm password</label>
            <input
              type="password"
              class="form-control"
              placeholder="Re-enter password"
              [(ngModel)]="confirmPassword">
          </div>

          <!-- Role -->
          <div class="mb-3">
            <label class="form-label">Select role</label>
            <select class="form-select" [(ngModel)]="role">
              <option value="User">User</option>
              <option value="Admin">Admin</option>
              <option value="Manager">Manager</option>
            </select>
          </div>

          <!-- Alerts -->
          <div *ngIf="errorMsg" class="alert alert-danger py-2 text-center">
            {{ errorMsg }}
          </div>

          <div *ngIf="successMsg" class="alert alert-success py-2 text-center">
            {{ successMsg }}
          </div>

          <!-- Button -->
          <button
            class="btn btn-primary w-100 py-2 mt-2"
            (click)="register()">
            Register
          </button>

          <!-- Footer -->
          <div class="text-center mt-3">
            <span class="text-muted small">
              Already have an account?
            </span>
            <a routerLink="/login" class="fw-semibold ms-1">
              Back to Login
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>

</div>

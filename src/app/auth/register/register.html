<app-form-wrapper [form]="form" (submitted)="register()">

  <app-input
    label="Email"
    type="email"
    [formControl]="email"
    [errorMessage]="
      email.touched && email.invalid
        ? 'Valid email required'
        : ''
    ">
  </app-input>

  <app-input
    label="Password"
    type="password"
    [formControl]="password"
    [errorMessage]="
      password.touched && password.invalid
        ? 'Password required'
        : ''
    ">
  </app-input>

  <app-input
    label="Confirm Password"
    type="password"
    [formControl]="confirmPassword"
    [errorMessage]="
      confirmPassword.touched && confirmPassword.invalid
        ? 'Confirm password required'
        : ''
    ">
  </app-input>

  <app-select
    label="Role"
    [options]="roles"
    [formControl]="role"
    [errorMessage]="
      role.touched && role.invalid
        ? 'Role is required'
        : ''
    ">
  </app-select>

  <app-button label="Register" type="submit"></app-button>

  <p class="text-center mt-3">
    Already have an account?
    <a routerLink="/login">Login</a>
  </p>

</app-form-wrapper>

<div class="container vh-100 d-flex align-items-center justify-content-center">

  <div class="card shadow-lg border-0" style="width: 420px">

    <div class="card-body p-4">

      <div class="text-center mb-4">
        <img src="assets/logo.png" height="60">
        <h4 class="mt-3 fw-bold">Create your account</h4>
        <p class="text-muted small">User Management System</p>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" [(ngModel)]="email">
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" [(ngModel)]="password">
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" [(ngModel)]="confirmPassword">
      </div>

      <div class="alert alert-danger" *ngIf="errorMsg">{{ errorMsg }}</div>
      <div class="alert alert-success" *ngIf="successMsg">{{ successMsg }}</div>
      <div class="mb-3">
        <label class="form-label">Select Role</label>
        <select class="form-control" [(ngModel)]="role">
          <option value="User">User</option>
          <option value="Admin">Admin</option>
          <option value="Manager">Manager</option>
        </select>
      </div>


      <button class="btn btn-primary w-100 py-2" (click)="register()">
        Register
      </button>

      <div class="text-center mt-3">
        <a routerLink="/login">Back to Login</a>
      </div>

    </div>
  </div>

</div>

<div class="empty-state" *ngIf="dataSource.data.length === 0">
  No data found
</div>

<div class="desktop-table" *ngIf="dataSource.data.length > 0">

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2 user-table">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> Id </th>
      <td mat-cell *matCellDef="let row">{{row.id}}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let row">{{row.name}}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let row">{{row.email}}</td>
    </ng-container>

    <ng-container matColumnDef="department">
      <th mat-header-cell *matHeaderCellDef> Department </th>
      <td mat-cell *matCellDef="let row">{{row.department}}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let row">
        <span class="status-pill"
              [class.active]="row.status === 'Active'"
              [class.inactive]="row.status === 'Inactive'">
          {{row.status}}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef> Action </th>
      <td mat-cell *matCellDef="let row" class="action-cell">
        <button class="btn view" (click)="view.emit(row)">View</button>
        <button class="btn edit" (click)="edit.emit(row.id)">Edit</button>
        <button class="btn delete" (click)="remove.emit(row.id)">Delete</button>
      </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  </table>

  <mat-paginator
    *ngIf="dataSource.data.length > 0"
    [pageSize]="5">
  </mat-paginator>

</div>

<!-- MOBILE TABLE -->
<div class="mobile-table" *ngIf="dataSource.data.length > 0">

  <div class="mobile-row" *ngFor="let row of dataSource.data">

    <div class="mobile-main">
      <div class="m-left">
        <b>{{row.name}}</b>
        <small>{{row.email}}</small>
      </div>

      <span class="status-pill"
            [class.active]="row.status==='Active'"
            [class.inactive]="row.status==='Inactive'">
        {{row.status}}
      </span>
    </div>

    <div class="mobile-actions">
      <button class="btn view" (click)="view.emit(row)">View</button>
      <button class="btn edit" (click)="edit.emit(row.id)">Edit</button>
      <button class="btn delete" (click)="remove.emit(row.id)">Delete</button>
      <button class="btn more" (click)="row._open = !row._open">
        {{ row._open ? 'Less' : 'More' }}
      </button>
    </div>

    <div class="mobile-expand" *ngIf="row._open">
      <div><span>Id</span><b>{{row.id}}</b></div>
      <div><span>Department</span><b>{{row.department}}</b></div>
    </div>


  </div>
</div>

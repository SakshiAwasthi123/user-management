<!-- EMPTY STATE -->
<div class="empty-state" *ngIf="dataSource.data.length === 0">
  No users found
</div>

<!-- TABLE -->
<div class="table-wrapper" *ngIf="dataSource.data.length > 0">

  <!-- SCROLL WRAPPER (important for mobile) -->
  <div class="table-scroll">

    <table mat-table [dataSource]="dataSource" matSort class="modern-table">

      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Id</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <!-- NAME -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>

      <!-- EMAIL -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let row">{{ row.email }}</td>
      </ng-container>

      <!-- DEPARTMENT -->
      <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Department</th>
        <td mat-cell *matCellDef="let row">{{ row.department }}</td>
      </ng-container>

      <!-- STATUS -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let row">
          <span
            class="status-badge"
            [ngClass]="row.status === 'Active' ? 'active' : 'inactive'">
            {{ row.status }}
          </span>
        </td>
      </ng-container>

      <!-- ACTION -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef class="action-header">Action</th>
        <td mat-cell *matCellDef="let row" class="action-cell">
          <button class="action-btn view" (click)="onView(row)">View</button>
          <button class="action-btn edit" (click)="onEdit(row.id)">Edit</button>
          <button class="action-btn delete" (click)="onDelete(row.id)">Delete</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns" class="header-row"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" class="data-row"></tr>

    </table>

  </div>

  <mat-paginator
    [pageSize]="5"
    [pageSizeOptions]="[5,10,15]"
    showFirstLastButtons>
  </mat-paginator>

</div>

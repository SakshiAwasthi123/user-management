<mat-dialog-content class="dialog-content">

  <div class="profile-header">
    <mat-icon class="avatar-icon">person</mat-icon>
    <div>
      <h2>{{ user.name }}</h2>
      <p>{{ user.email }}</p>
    </div>
  </div>

  <table class="profile-table">
    <tr><th>Department</th><td>{{ user.department }}</td></tr>
    <tr><th>Employment</th><td>{{ user.employedType }}</td></tr>
    <tr><th>Company</th><td>{{ user.company || '-' }}</td></tr>
    <tr><th>Gender</th><td>{{ user.gender }}</td></tr>
    <tr><th>Status</th><td>
      <span class="status-badge"
        [class.active]="user.status==='Active'"
        [class.inactive]="user.status==='Inactive'">
        {{ user.status }}
      </span>
    </td></tr>
    <tr><th>Skills</th><td>{{ user.skills?.join(', ') }}</td></tr>
  </table>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" (click)="download()">Download PDF</button>
  <button mat-stroked-button mat-dialog-close>Close</button>
</mat-dialog-actions>

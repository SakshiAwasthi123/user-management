<div class="list-toolbar">
  <h2 class="page-title">User List</h2>

  <div class="toolbar-actions">
    <button class="add-btn" (click)="goAdd()">
      ➕ Add User
    </button>

    <button class="export-btn" (click)="exportCSV()">
      ⬇ Export CSV
    </button>

    <div class="search-box">
      <input
        type="text"
        placeholder="Search users..."
        (input)="table.filter($any($event.target).value)"
      />
      <span class="icon">🔍</span>
    </div>
  </div>
</div>

<div class="table-card">
  <app-shared-table #table
    [data]="users"
    [columns]="['id','name','email','department','status']"
    (view)="open($event)"
    (edit)="goEdit($event)"
    (remove)="delete($event)">
  </app-shared-table>
</div>

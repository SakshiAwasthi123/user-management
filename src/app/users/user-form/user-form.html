<section class="user-form-page">
  <mat-card class="user-form-card">

    <div class="form-header">
      <h2>{{ id ? 'Edit User' : 'Add New User' }}</h2>
      <p class="subtitle">Fill the details below to save user information</p>
    </div>

    <div *ngIf="successMsg" class="alert alert-success mb-3">
      {{ successMsg }}
    </div>

    <div *ngIf="errorMsg" class="alert alert-danger mb-3">
      {{ errorMsg }}
    </div>

    <app-form-wrapper [form]="form" (submitted)="submit()">

      <div class="form-grid">

        <!-- NAME -->
        <app-input
          label="Full Name"
          [formControl]="name"
          [errorMessage]="name.touched && name.invalid ? 'Name is required' : ''">
        </app-input>

        <!-- EMAIL -->
        <app-input
          label="Email"
          type="email"
          [formControl]="email"
          [errorMessage]="email.touched && email.invalid ? 'Valid email required' : ''">
        </app-input>

        <!-- DEPARTMENT -->
        <app-select
          label="Department"
          [options]="departmentOptions"
          [formControl]="department"
          [errorMessage]="department.touched && department.invalid ? 'Department is required' : ''">
        </app-select>

        <!-- EMPLOYMENT TYPE -->
        <app-select
          label="Employment Type"
          [options]="employmentOptions"
          [formControl]="employedType"
          [errorMessage]="employedType.touched && employedType.invalid ? 'Employment type is required' : ''">
        </app-select>

        <!-- COMPANY -->
        <app-input
          *ngIf="employedType.value === 'employed'"
          label="Company"
          [formControl]="company"
          [errorMessage]="company.touched && company.invalid ? 'Company is required' : ''">
        </app-input>

        <!-- STATUS -->
        <app-select
          label="Status"
          [options]="statusOptions"
          [formControl]="status"
          [errorMessage]="status.touched && status.invalid ? 'Status is required' : ''">
        </app-select>

        <!-- GENDER -->
        <div class="gender-section">
          <label class="section-label">Gender</label>

          <app-radio
            [options]="genderOptions"
            [formControl]="gender">
          </app-radio>

          <small class="error" *ngIf="gender.touched && gender.invalid">
            Gender is required
          </small>
        </div>

      </div>

      <!-- SKILLS -->
      <div class="skills-section">
        <h5>Skills</h5>

        <div
          class="skill-row"
          *ngFor="let ctrl of skillsControls; let i = index">

          <app-input
            [formControl]="ctrl"
            [errorMessage]="ctrl.touched && ctrl.invalid ? 'Skill required' : ''">
          </app-input>

          <button type="button" (click)="removeSkill(i)">✕</button>
        </div>

        <small class="error" *ngIf="skillsControls.length === 0 && form.touched">
          At least one skill is required
        </small>

        <button type="button" (click)="addSkill()">+ Add Skill</button>
      </div>

      <!-- TERMS -->
      <div class="terms-section">
        <app-checkbox
          label="Agree to terms"
          [formControl]="agree">
        </app-checkbox>

        <small class="error" *ngIf="agree.touched && agree.invalid">
          You must accept terms
        </small>
      </div>

      <!-- FOOTER -->
      <div class="form-footer">
        <app-button label="Cancel" type="button" (clicked)="goBack()"></app-button>
        <app-button [label]="id ? 'Update' : 'Save'" type="submit"></app-button>
      </div>

    </app-form-wrapper>

  </mat-card>
</section>

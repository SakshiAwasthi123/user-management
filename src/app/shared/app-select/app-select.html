<div class="mb-3">
  <label class="form-label">{{ label }}</label>

  <select
    class="form-select"
    [ngModel]="selectedValue"
    (ngModelChange)="onChange($event)">

    <option value="">Select</option>

    <option *ngFor="let opt of options" [value]="opt.value">
      {{ opt.label }}
    </option>

  </select>
</div>

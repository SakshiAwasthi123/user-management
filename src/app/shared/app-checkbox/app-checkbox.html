<div class="form-check">
  <input
    class="form-check-input"
    type="checkbox"
    [checked]="value"
    [disabled]="disabled"
    (change)="toggle($event)"
  />

  <label class="form-check-label">
    {{ label }}
  </label>
</div>

<small class="text-danger" *ngIf="errorMessage">
  {{ errorMessage }}
</small>

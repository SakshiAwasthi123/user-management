<div class="form-group">
  <label *ngIf="label">{{ label }}</label>

  <input
    class="form-control"
    [type]="type"
    [placeholder]="placeholder"
    [value]="value || ''"
    [disabled]="disabled"
    (input)="onChange($any($event.target).value)"
    (blur)="onTouched()"
  />

  <small class="text-danger" *ngIf="errorMessage">
    {{ errorMessage }}
  </small>
</div>
